<!DOCTYPE html>
<html lang="en" data-meta-title-key="checkout.meta.information" data-meta-description-key="checkout.secure">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Metche</title>
  <meta name="description" content="Preview checkout. No payment is taken.">
  <meta property="og:title" content="Checkout | Metche">
  <meta property="og:description" content="Preview checkout. No payment is taken.">
  <meta property="og:image" content="../assets/images/brand/metche-opengraph.webp">
  <link rel="icon" href="../assets/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/webp" sizes="32x32" href="../assets/icons/favicon-32x32.webp">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="checkout-page" data-checkout="information">
  <div class="checkout-shell">
    <div class="checkout-main">
      <div class="checkout-main-inner">
        <header class="checkout-top">
          <a class="checkout-logo" href="../index.html" aria-label="Metche home" data-i18n-aria="aria.home">
            <img src="../assets/icons/logo.webp" alt="Metche" width="970" height="669" data-i18n-alt="brand.logo">
          </a>
          <div class="lang-switcher" role="group" aria-label="Language" data-i18n-aria="aria.language" data-active="en">
            <button type="button" class="lang-btn lang-btn--active" data-lang="en" aria-pressed="true">EN</button>
            <button type="button" class="lang-btn" data-lang="mk" aria-pressed="false">MK</button>
          </div>
        </header>

        <nav class="checkout-steps" aria-label="Checkout">
          <a href="../index.html?cart=open" data-i18n="checkout.step.cart">Cart</a>
          <span aria-hidden="true">/</span>
          <span class="is-current" aria-current="step" data-i18n="checkout.step.information">Information</span>
          <span aria-hidden="true">/</span>
          <span data-i18n="checkout.step.shipping">Shipping</span>
          <span aria-hidden="true">/</span>
          <span data-i18n="checkout.step.payment">Payment</span>
        </nav>

        <div class="checkout-empty" id="checkoutEmpty" hidden>
          <h1 data-i18n="checkout.empty.title">Your cart is empty</h1>
          <p data-i18n="checkout.empty.text">Add a jar before you check out.</p>
          <a class="btn btn-primary" href="../products/all.html" data-i18n="checkout.empty.cta">Continue shopping</a>
        </div>

        <form id="informationForm" class="checkout-flow" novalidate>
          <div id="checkoutFlow">
            <section class="checkout-section">
              <h1 data-i18n="checkout.contact">Contact</h1>
              <div class="checkout-field">
                <label for="email" data-i18n="checkout.email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" inputmode="email">
                <p class="checkout-error" data-error-for="email" hidden></p>
              </div>
              <label class="checkout-check">
                <input type="checkbox" name="marketing">
                <span data-i18n="checkout.marketing">Email me news and offers</span>
              </label>
            </section>

            <section class="checkout-section">
              <h2 data-i18n="checkout.delivery">Delivery</h2>
              <div class="checkout-fields">
                <div class="checkout-field checkout-field--full">
                  <label for="country" data-i18n="checkout.country">Country / region</label>
                  <select id="country" name="country" data-countries autocomplete="country"></select>
                </div>
                <div class="checkout-field">
                  <label for="firstName" data-i18n="checkout.firstName">First name</label>
                  <input id="firstName" name="firstName" type="text" autocomplete="given-name">
                  <p class="checkout-error" data-error-for="firstName" hidden></p>
                </div>
                <div class="checkout-field">
                  <label for="lastName" data-i18n="checkout.lastName">Last name</label>
                  <input id="lastName" name="lastName" type="text" autocomplete="family-name">
                  <p class="checkout-error" data-error-for="lastName" hidden></p>
                </div>
                <div class="checkout-field checkout-field--full">
                  <label for="address" data-i18n="checkout.address">Address</label>
                  <input id="address" name="address" type="text" autocomplete="address-line1">
                  <p class="checkout-error" data-error-for="address" hidden></p>
                </div>
                <div class="checkout-field checkout-field--full">
                  <label for="apartment" data-i18n="checkout.apartment">Apartment, suite (optional)</label>
                  <input id="apartment" name="apartment" type="text" autocomplete="address-line2">
                </div>
                <div class="checkout-field">
                  <label for="city" data-i18n="checkout.city">City</label>
                  <input id="city" name="city" type="text" autocomplete="address-level2">
                  <p class="checkout-error" data-error-for="city" hidden></p>
                </div>
                <div class="checkout-field">
                  <label for="postal" data-i18n="checkout.postal">Postal code</label>
                  <input id="postal" name="postal" type="text" autocomplete="postal-code">
                  <p class="checkout-error" data-error-for="postal" hidden></p>
                </div>
                <div class="checkout-field checkout-field--full">
                  <label for="phone" data-i18n="checkout.phone">Phone (optional)</label>
                  <input id="phone" name="phone" type="tel" autocomplete="tel">
                </div>
                <div class="checkout-field checkout-field--full">
                  <label for="notes" data-i18n="checkout.notes">Delivery note (optional)</label>
                  <textarea id="notes" name="notes" autocomplete="off"></textarea>
                </div>
              </div>
            </section>

            <div class="checkout-actions">
              <a class="checkout-return" href="../index.html?cart=open" data-i18n="checkout.return">Return to cart</a>
              <button class="btn btn-primary" type="submit" data-i18n="checkout.continue.shipping">Continue to shipping</button>
            </div>

            <footer class="checkout-footer">
              <a href="../pages/terms.html" data-i18n="footer.terms">Terms</a>
              <a href="../pages/privacy.html" data-i18n="footer.privacy">Privacy</a>
              <a href="../pages/contact.html" data-i18n="footer.contact">Contact</a>
            </footer>
          </div>
        </form>
      </div>
    </div>

    <aside class="checkout-summary" aria-labelledby="summaryTitle">
      <div class="checkout-summary-inner">
        <button type="button" class="checkout-summary-toggle" id="summaryToggle" aria-expanded="false" aria-controls="summaryBody">
          <span id="summaryToggleLabel" data-i18n="checkout.showSummary">Show order summary</span>
          <span id="summaryToggleTotal">€0</span>
        </button>
        <div class="checkout-summary-body" id="summaryBody">
          <h2 id="summaryTitle" data-i18n="checkout.summary">Order summary</h2>
          <div id="checkoutSummary"></div>
        </div>
      </div>
    </aside>
  </div>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/checkout.js"></script>
</body>
</html>
